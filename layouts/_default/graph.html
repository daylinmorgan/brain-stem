{{ define "head"}}
<script src="https://d3js.org/d3.v6.min.js"></script>
<style type="text/css">
svg circle.node {
  stroke-width: 1.5px;
}

svg line.link {
  stroke: #6c7086;
  stroke-opacity: .6;
  stroke-width: 2px;
}

div.tooltip {
  position: absolute;
  text-align: center;
  visibility: hidden;
  width: 100px;
  padding: 2px;
  font: 12px sans-serif;
  background:#1e1e2e;
  border: 1px solid #6c7086;
  border-radius: 8px;
  pointer-events: none;
}
</style>
{{ end }}
{{ define "main" }}
<div id="graph" relative h-full w-full bg-ctp-base rounded-md p-4>
<button id="clear-active" type="button" hidden
  class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-ctp-surface0 text-ctp-text hover:bg-ctp-surface1">
  clear pinned node
</button>
<div class="tooltip"></div>

</div>
<p text-xs text-ctp-subtext0 mt-2 text-center>
  tip: double-click a node to open that note &middot; double-click the background to shuffle/reset the graph
</p>

{{ end }}
{{ define "footer"}}
{{- $js := resources.Get "js/graph.js" | minify | fingerprint -}}
<script src="{{ $js.RelPermalink }}"></script>
{{ end }}
