{{ define "main" }}
<div relative bg-ctp-base rounded-md p-4>

<div markdown>
  <h1 font-mono-casual font-black>
      <a href="{{ .Permalink }}">#</a>
      {{ .Title }}
  </h1>

{{ .Content }}
</div>

{{ partial "backlinks.html" (dict "page" .) }}

{{ if isset .Params "book" }}
{{ partial "book.html" . }}
{{ end }}

{{ with .File }}
<a class="link absolute bottom-2 right-3 text-xs font-mono"
   href="/graph/?node={{ .ContentBaseName }}">view in graph</a>
{{ end }}

</div>
{{ partial "meta.html" . }}
{{ end }}
